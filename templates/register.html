{% extends 'base.html' %}
{% block title %}Register Staff - SmartStock{% endblock %}

{% block guest_content %}
<div class="auth-card" style="max-width: 520px;">
  <div class="auth-brand">
    <div class="brand-icon" style="width: 44px; height: 44px; font-size: 1.4rem;">
      <i class="bi bi-cart3"></i>
    </div>
    <div>
      <h3 class="mb-0 fw-bold">Smart<span style="color: var(--primary);">Stock</span></h3>
      <div class="text-muted small">Employee Onboarding Portal</div>
    </div>
  </div>

  <div class="text-center mb-4">
    <h5 class="fw-bold mb-1">Create an Account</h5>
    <p class="text-muted small">Set up an authorized supermarket staff profile</p>
  </div>

  <form method="POST" action="{{ url_for('auth.register') }}">
    <div class="row g-2 mb-3">
      <div class="col-sm-6">
        <label class="form-label fw-semibold small text-muted">Full Name <span class="text-danger">*</span></label>
        <input type="text" name="full_name" class="form-control" placeholder="Rohan Sharma" value="{{ full_name or '' }}" required>
      </div>
      <div class="col-sm-6">
        <label class="form-label fw-semibold small text-muted">Username <span class="text-danger">*</span></label>
        <input type="text" name="username" class="form-control" placeholder="rohans" value="{{ username or '' }}" required>
      </div>
    </div>

    <div class="row g-2 mb-3">
      <div class="col-sm-6">
        <label class="form-label fw-semibold small text-muted">Work Email <span class="text-danger">*</span></label>
        <input type="email" name="email" class="form-control" placeholder="rohan@smartstock.in" value="{{ email or '' }}" required>
      </div>
      <div class="col-sm-6">
        <label class="form-label fw-semibold small text-muted">Mobile Number</label>
        <input type="tel" name="phone" class="form-control" placeholder="+91 98765 00000" value="{{ phone or '' }}">
      </div>
    </div>

    <div class="mb-3">
      <label class="form-label fw-semibold small text-muted">System Role <span class="text-danger">*</span></label>
      <div class="d-flex gap-3">
        <div class="form-check flex-fill border rounded-3 p-2 ps-4">
          <input class="form-check-input" type="radio" name="role" id="roleStaff" value="staff" {% if role != 'admin' %}checked{% endif %}>
          <label class="form-check-label fw-semibold" for="roleStaff">
            Staff / Cashier
            <div class="text-muted small" style="font-size: 0.75rem; font-weight: normal;">POS sales, inventory view, receipt printing</div>
          </label>
        </div>
        <div class="form-check flex-fill border rounded-3 p-2 ps-4">
          <input class="form-check-input" type="radio" name="role" id="roleAdmin" value="admin" {% if role == 'admin' %}checked{% endif %}>
          <label class="form-check-label fw-semibold text-primary" for="roleAdmin">
            Store Admin
            <div class="text-muted small" style="font-size: 0.75rem; font-weight: normal;">Full access, product/category CRUD, financial reports</div>
          </label>
        </div>
      </div>
    </div>

    <div class="row g-2 mb-4">
      <div class="col-sm-6">
        <label class="form-label fw-semibold small text-muted">Password <span class="text-danger">*</span></label>
        <input type="password" name="password" class="form-control" placeholder="Min 6 characters" required>
      </div>
      <div class="col-sm-6">
        <label class="form-label fw-semibold small text-muted">Confirm Password <span class="text-danger">*</span></label>
        <input type="password" name="confirm_password" class="form-control" placeholder="Repeat password" required>
      </div>
    </div>

    <button type="submit" class="btn btn-primary w-100 py-2 fw-bold shadow-sm">
      <i class="bi bi-person-plus-fill me-1"></i> Register Account
    </button>
  </form>

  <div class="text-center mt-4 pt-3 border-top">
    <span class="small text-muted">Already have credentials?</span>
    <a href="{{ url_for('auth.login') }}" class="small fw-bold ms-1 text-primary">Sign In here</a>
  </div>
</div>
{% endblock %}
